<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Huyền Chi | Profile</title>
    <meta name="description" content="Trang cá nhân của Huyền Chi" />
    <meta property="og:title" content="@Huyền Chi | Profile" />
    <meta
      property="og:description"
      content="Trang cá nhân của Nguyễn Thị Huyền Chi"
    />
    <meta property="theme-color" content="#ffffff" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #000;
        color: #fff;
        height: 100vh; /* Fallback for older browsers */
        height: 100dvh;
        max-height: 100vh; /* Fallback for older browsers */
        max-height: 100dvh;
        overflow: hidden;
        position: relative;
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Background Image */
      .background-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          #0a0a0a 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        z-index: 0;
        overflow: hidden;
      }

      /* Background Video */
      .background-video {
        position: fixed;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        z-index: 0;
        object-fit: cover;
        opacity: 0.6;
      }

      .background-image::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(
            circle at 20% 80%,
            rgba(79, 172, 254, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(255, 110, 196, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            circle at 40% 40%,
            rgba(120, 115, 245, 0.2) 0%,
            transparent 50%
          );
        animation: backgroundPulse 8s ease-in-out infinite;
      }

      @keyframes backgroundPulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      /* Animated Tech Characters */
      .tech-characters {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .tech-char {
        position: absolute;
        font-family: "Courier New", monospace;
        font-size: 14px;
        font-weight: bold;
        color: #4facfe;
        text-shadow: 0 0 10px rgba(79, 172, 254, 0.8);
        opacity: 0;
        animation: charFadeInOut 3s ease-in-out infinite;
      }

      .tech-char:nth-child(odd) {
        color: #00f2fe;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        animation-delay: 1.5s;
      }

      .tech-char:nth-child(3n) {
        color: #ff6ec4;
        text-shadow: 0 0 10px rgba(255, 110, 196, 0.8);
        animation-delay: 3s;
      }

      @keyframes charFadeInOut {
        0%,
        100% {
          opacity: 0;
          transform: translateY(20px) scale(0.8);
        }
        20%,
        80% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Animated Tech Lines */
      .tech-lines {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .tech-line {
        position: absolute;
        background: linear-gradient(
          to bottom,
          transparent,
          #4facfe,
          transparent
        );
        width: 2px;
        height: 100px;
        opacity: 0;
        animation: lineGlow 4s ease-in-out infinite;
      }

      .tech-line:nth-child(odd) {
        background: linear-gradient(
          to bottom,
          transparent,
          #00f2fe,
          transparent
        );
        animation-delay: 2s;
      }

      .tech-line:nth-child(3n) {
        background: linear-gradient(
          to bottom,
          transparent,
          #ff6ec4,
          transparent
        );
        animation-delay: 4s;
      }

      @keyframes lineGlow {
        0%,
        100% {
          opacity: 0;
          transform: translateY(100px) scaleY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(0) scaleY(1);
        }
      }

      /* Circular Text Animation */
      .circular-text-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 50;
        pointer-events: none;
        overflow: hidden;
      }

      .circular-text {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .circular-word {
        position: absolute;
        font-size: 2.5rem;
        font-weight: 700;
        color: #4facfe;
        text-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
        transform-origin: 50% 50%;
        animation: magicalCharGlow 3s ease-in-out infinite;
        white-space: nowrap;
        filter: blur(0px);
        transition: all 0.1s linear;
        cursor: pointer;
      }

      .circular-word:nth-child(1) {
        color: #4facfe;
        text-shadow: 0 0 20px rgba(79, 172, 254, 0.8);
        animation-delay: 0s, 0s, 0s;
      }

      .circular-word:nth-child(2) {
        color: #00f2fe;
        text-shadow: 0 0 20px rgba(0, 242, 254, 0.8);
        animation-delay: 1s, 1s, 1.5s;
      }

      .circular-word:nth-child(3) {
        color: #ff6ec4;
        text-shadow: 0 0 20px rgba(255, 110, 196, 0.8);
        animation-delay: 2s, 2s, 3s;
      }

      .circular-word:nth-child(4) {
        color: #7873f5;
        text-shadow: 0 0 20px rgba(120, 115, 245, 0.8);
        animation-delay: 3s, 3s, 4.5s;
      }

      /* Magical Container Animations */
      @keyframes magicalFloat {
        0%,
        100% {
          transform: translateY(0px) rotateX(0deg) rotateY(0deg);
        }
        25% {
          transform: translateY(-20px) rotateX(5deg) rotateY(5deg);
        }
        50% {
          transform: translateY(-10px) rotateX(-3deg) rotateY(-3deg);
        }
        75% {
          transform: translateY(-30px) rotateX(8deg) rotateY(-5deg);
        }
      }

      @keyframes magicalPulse {
        0%,
        100% {
          transform: scale(1);
          filter: hue-rotate(0deg);
        }
        50% {
          transform: scale(1.05);
          filter: hue-rotate(180deg);
        }
      }

      @keyframes magicalGlow {
        0%,
        100% {
          filter: brightness(1) drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
        }
        50% {
          filter: brightness(1.3) drop-shadow(0 0 40px rgba(255, 255, 255, 0.8));
        }
      }

      /* Magical Character Animations */
      @keyframes magicalCharFloat {
        0%,
        100% {
          transform: translateY(0px) translateX(0px) scale(1);
        }
        25% {
          transform: translateY(-15px) translateX(10px) scale(1.1);
        }
        50% {
          transform: translateY(-5px) translateX(-5px) scale(0.9);
        }
        75% {
          transform: translateY(-25px) translateX(-10px) scale(1.05);
        }
      }

      @keyframes magicalCharGlow {
        0%,
        100% {
          text-shadow: 0 0 20px currentColor, 0 0 40px currentColor,
            0 0 60px rgba(255, 255, 255, 0.5);
          filter: blur(0px);
        }
        50% {
          text-shadow: 0 0 30px currentColor, 0 0 60px currentColor,
            0 0 90px currentColor, 0 0 120px rgba(255, 255, 255, 0.8);
          filter: blur(1px);
        }
      }

      @keyframes magicalCharRotate {
        0% {
          transform: rotate(0deg) rotateY(0deg);
        }
        25% {
          transform: rotate(90deg) rotateY(5deg);
        }
        50% {
          transform: rotate(180deg) rotateY(0deg);
        }
        75% {
          transform: rotate(270deg) rotateY(-5deg);
        }
        100% {
          transform: rotate(360deg) rotateY(0deg);
        }
      }

      /* Magic Sparkles */
      .magic-sparkles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 60;
      }

      .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #fff;
        border-radius: 50%;
        opacity: 0;
        animation: sparkleAnimation 3s ease-in-out infinite;
      }

      .sparkle:nth-child(odd) {
        background: #4facfe;
        animation-delay: 0.5s;
      }

      .sparkle:nth-child(3n) {
        background: #ff6ec4;
        animation-delay: 1s;
      }

      .sparkle:nth-child(4n) {
        background: #00f2fe;
        animation-delay: 1.5s;
      }

      @keyframes sparkleAnimation {
        0%,
        100% {
          opacity: 0;
          transform: scale(0) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(1.5) rotate(180deg);
        }
      }

      /* Main Container */
      .container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh; /* Fallback for older browsers */
        height: 100dvh;
        max-height: 100vh; /* Fallback for older browsers */
        max-height: 100dvh;
        padding: 150px 20px 50px;
        box-sizing: border-box;
      }

      /* Profile Card */
      .profile-card {
        border-radius: 25px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Avatar */
      .avatar {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        margin: 0 auto 25px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        animation: pulse 3s ease-in-out infinite;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-size: 4rem;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Username */
      .username {
        font-size: 3.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 15px;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 5px;
        overflow: hidden;
        white-space: nowrap;
      }

      .username .char {
        display: inline-block;
        opacity: 0;
        transform: translateX(-100px);
        transition: all 0.3s ease;
      }

      .username .char:nth-child(1) {
        --char-index: 0;
      }
      .username .char:nth-child(2) {
        --char-index: 1;
      }
      .username .char:nth-child(3) {
        --char-index: 2;
      }
      .username .char:nth-child(4) {
        --char-index: 3;
      }
      .username .char:nth-child(5) {
        --char-index: 4;
      }
      .username .char:nth-child(6) {
        --char-index: 5;
      }
      .username .char:nth-child(7) {
        --char-index: 6;
      }
      .username .char:nth-child(8) {
        --char-index: 7;
      }
      .username .char:nth-child(9) {
        --char-index: 8;
      }
      .username .char:nth-child(10) {
        --char-index: 9;
      }
      .username .char:nth-child(11) {
        --char-index: 10;
      }
      .username .char:nth-child(12) {
        --char-index: 11;
      }
      .username .char:nth-child(13) {
        --char-index: 12;
      }

      /* 4 Direction Animations */
      @keyframes charSlideFromLeft {
        0% {
          opacity: 0;
          transform: translateX(-100px) scale(0.5);
          filter: blur(10px);
        }
        50% {
          opacity: 0.7;
          transform: translateX(-20px) scale(0.8);
          filter: blur(3px);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
          filter: blur(0px);
        }
      }

      @keyframes charSlideFromRight {
        0% {
          opacity: 0;
          transform: translateX(100px) scale(0.5);
          filter: blur(10px);
        }
        50% {
          opacity: 0.7;
          transform: translateX(20px) scale(0.8);
          filter: blur(3px);
        }
        100% {
          opacity: 1;
          transform: translateX(0) scale(1);
          filter: blur(0px);
        }
      }

      @keyframes charSlideFromTop {
        0% {
          opacity: 0;
          transform: translateY(-100px) scale(0.5);
          filter: blur(10px);
        }
        50% {
          opacity: 0.7;
          transform: translateY(-20px) scale(0.8);
          filter: blur(3px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
      }

      @keyframes charSlideFromBottom {
        0% {
          opacity: 0;
          transform: translateY(100px) scale(0.5);
          filter: blur(10px);
        }
        50% {
          opacity: 0.7;
          transform: translateY(20px) scale(0.8);
          filter: blur(3px);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0px);
        }
      }

      /* Hover effect for individual characters */
      .username .char:hover {
        transform: scale(1.2) rotate(5deg);
        filter: brightness(1.3);
      }

      /* Entry Text */
      .entry-text {
        text-align: center;
        font-size: 1.2rem;
        color: white;
        margin-bottom: 30px;
        animation: blink 2s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Social Icons */
      .socials {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
        flex-wrap: wrap;
      }

      .social-icon {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #fff;
        font-size: 1.8rem;
        transition: all 0.3s ease;
        cursor: pointer;
        animation: socialFloat 3s ease-in-out infinite,
          socialPulse 2s ease-in-out infinite;
      }

      .social-icon:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-5px) scale(1.1);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        animation-play-state: paused;
      }

      /* Social Icon Animations */
      @keyframes socialFloat {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        25% {
          transform: translateY(-8px) rotate(1deg);
        }
        50% {
          transform: translateY(-12px) rotate(0deg);
        }
        75% {
          transform: translateY(-8px) rotate(-1deg);
        }
      }

      @keyframes socialPulse {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
          background: rgba(255, 255, 255, 0.15);
        }
        50% {
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
          background: rgba(255, 255, 255, 0.25);
        }
      }

      /* Individual icon animations */
      .social-icon:nth-child(1) {
        animation-delay: 0s;
        animation: socialFloat 3s ease-in-out infinite,
          socialPulse 2s ease-in-out infinite,
          socialGlow 4s ease-in-out infinite;
      }

      .social-icon:nth-child(2) {
        animation-delay: 1.5s;
        animation: socialFloat 3s ease-in-out infinite,
          socialPulse 2s ease-in-out infinite,
          socialGlow 4s ease-in-out infinite;
      }

      @keyframes socialGlow {
        0%,
        100% {
          filter: brightness(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        25% {
          filter: brightness(1.2) drop-shadow(0 0 10px rgba(79, 172, 254, 0.5));
        }
        50% {
          filter: brightness(1.4) drop-shadow(0 0 15px rgba(255, 110, 196, 0.6));
        }
        75% {
          filter: brightness(1.2) drop-shadow(0 0 10px rgba(120, 115, 245, 0.5));
        }
      }

      /* Shooting Stars */
      .shooting-star {
        position: fixed;
        width: 5px;
        height: 5px;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
        z-index: 50;
        animation: shoot 2s linear forwards, glow 0.8s ease-in-out infinite;
        user-select: none;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      }

      /* Star trail */
      .shooting-star::before {
        content: "";
        position: absolute;
        top: 50%;
        left: -50px;
        width: 50px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent 0%,
          rgba(255, 255, 255, 0.8) 30%,
          rgba(255, 255, 255, 1) 70%,
          transparent 100%
        );
        transform: translateY(-50%);
        animation: trailFade 1s ease-out forwards;
      }

      @keyframes trailFade {
        0% {
          opacity: 1;
          transform: translateY(-50%) scaleX(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-50%) scaleX(0.3);
        }
      }

      @keyframes shoot {
        0% {
          transform: translateX(-10vw) translateY(-10vh);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateX(110vw) translateY(110vh);
          opacity: 0;
        }
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 5px rgba(255, 255, 255, 0.6),
            0 0 10px rgba(255, 255, 255, 0.4), 0 0 15px rgba(255, 255, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 10px rgba(255, 255, 255, 1),
            0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.6);
        }
      }

      /* Wave Visualizer */
      .wave-container {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 10000;
        width: 300px;
        height: 120px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .wave-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Music Video Player - Hidden but playing audio */
      .music-video-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 1000;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        width: 280px;
        height: 158px;
        opacity: 0;
        pointer-events: none;
        backdrop-filter: blur(10px);
      }

      .music-video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
      }

      /* Responsive design for video container - Hidden */
      @media (max-width: 768px) {
        .music-video-container {
          width: 200px;
          height: 113px;
          bottom: 20px;
          left: 50%;
          transform: translateX(-50%);
          opacity: 0;
        }
      }

      @media (max-width: 480px) {
        .music-video-container {
          width: 150px;
          height: 85px;
          bottom: 15px;
          left: 50%;
          transform: translateX(-50%);
          opacity: 0;
        }
      }

      /* Enter Overlay */
      .enter-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.8),
          rgba(26, 26, 46, 0.8),
          rgba(22, 33, 62, 0.8)
        );
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.8s ease, visibility 0.8s ease,
          backdrop-filter 0.8s ease;
      }

      .enter-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
      }

      .enter-overlay h1 {
        font-size: 4rem;
        font-weight: 700;
        background: linear-gradient(45deg, #ff6ec4, #7873f5, #4facfe, #00f2fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        margin-bottom: 20px;
        animation: gradientFlow 3s ease-in-out infinite;
        text-shadow: 0 0 40px rgba(255, 110, 196, 0.6);
        letter-spacing: 3px;
      }

      .enter-overlay p {
        font-size: 1.5rem;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        margin-bottom: 40px;
        animation: fadeInOut 2s ease-in-out infinite;
      }

      .enter-overlay .subtitle {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.6);
        text-align: center;
        animation: fadeInOut 2s ease-in-out infinite;
        animation-delay: 0.5s;
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }

    <script>
      (function () {
        // Elements
        const manhkiuc = document.getElementById("manhkiuc");
        const overlay = document.getElementById("playOverlay");
        const btnPlayUnmute = document.getElementById("playUnmuteBtn");
        const btnPlayMuted = document.getElementById("playMutedBtn");

        // Wave Visualizer Elements
        const waveCanvas = document.getElementById("waveCanvas");
        const waveCtx = waveCanvas.getContext("2d");
        const enterOverlay = document.getElementById("enterOverlay");

        // Audio Analysis
        let audioContext = null;
        let analyser = null;
        let source = null;
        let dataArray = null;
        let animationId = null;
        let isPlaying = false;
        let isMuted = false;
        let musicStarted = false;
        let audioSourceConnected = false;
        let audioPlaying = false;
        let globalAudioElement = null; // Store single audio instance

        // Initialize canvas
        function initCanvas() {
          const rect = waveCanvas.getBoundingClientRect();
          waveCanvas.width = rect.width * window.devicePixelRatio;
          waveCanvas.height = rect.height * window.devicePixelRatio;
          waveCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
          waveCanvas.style.width = rect.width + "px";
          waveCanvas.style.height = rect.height + "px";
        }

        // Initialize Web Audio API
        function initAudioContext() {
          if (!audioContext) {
            audioContext = new (window.AudioContext ||
              window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;

            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            console.log("🎵 Audio context initialized");
          }
        }

        // Connect video to audio analysis
        function connectAudioSource() {
          if (!audioContext || !manhkiuc) return;

          // Only connect once
          if (audioSourceConnected) {
            console.log("🎵 Audio source already connected, skipping");
            return;
          }

          try {
            source = audioContext.createMediaElementSource(manhkiuc);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            audioSourceConnected = true;
            console.log("🎵 Audio source connected to analyser");
          } catch (error) {
            console.warn("⚠️ Could not connect audio source:", error);

            // Try to create a simple oscillator as fallback
            try {
              console.log("🔄 Trying oscillator fallback...");
              const oscillator = audioContext.createOscillator();
              const gainNode = audioContext.createGain();

              oscillator.connect(gainNode);
              gainNode.connect(analyser);
              analyser.connect(audioContext.destination);

              gainNode.gain.setValueAtTime(0, audioContext.currentTime);
              oscillator.start();
              oscillator.stop(audioContext.currentTime + 0.1);

              console.log("🎵 Oscillator fallback connected");
            } catch (fallbackError) {
              console.warn("⚠️ Oscillator fallback failed:", fallbackError);
            }
          }
        }

        // Draw wave visualizer
        function drawWave() {
          // Check if audio analysis is available
          if (!analyser || !dataArray) {
            // Use fallback animation
            drawFallbackWave();
            return;
          }

          try {
            analyser.getByteFrequencyData(dataArray);

            const canvasWidth = waveCanvas.getBoundingClientRect().width;
            const canvasHeight = waveCanvas.getBoundingClientRect().height;

            // Clear canvas with fade effect
            waveCtx.fillStyle = "rgba(0, 0, 0, 0.1)";
            waveCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Calculate bass, mid, and treble frequencies
            const bassEnd = Math.floor(dataArray.length * 0.1);
            const midEnd = Math.floor(dataArray.length * 0.4);

            let bassSum = 0,
              midSum = 0,
              trebleSum = 0;
            for (let i = 0; i < bassEnd; i++) bassSum += dataArray[i];
            for (let i = bassEnd; i < midEnd; i++) midSum += dataArray[i];
            for (let i = midEnd; i < dataArray.length; i++)
              trebleSum += dataArray[i];

            const bassAvg = bassSum / bassEnd;
            const midAvg = midSum / (midEnd - bassEnd);
            const trebleAvg = trebleSum / (dataArray.length - midEnd);

            const totalEnergy = (bassAvg + midAvg + trebleAvg) / 3;
            const energyMultiplier = Math.min(totalEnergy / 50, 3); // Boost up to 3x

            // Create dynamic gradient based on frequency content
            const gradient = waveCtx.createLinearGradient(0, 0, canvasWidth, 0);
            if (bassAvg > midAvg && bassAvg > trebleAvg) {
              // Bass dominant - red to orange
              gradient.addColorStop(0, "#ff4444");
              gradient.addColorStop(0.5, "#ff8844");
              gradient.addColorStop(1, "#ffaa44");
            } else if (trebleAvg > bassAvg && trebleAvg > midAvg) {
              // Treble dominant - cyan to blue
              gradient.addColorStop(0, "#44ffff");
              gradient.addColorStop(0.5, "#4488ff");
              gradient.addColorStop(1, "#4444ff");
            } else {
              // Balanced - rainbow
              gradient.addColorStop(0, "#ff0000");
              gradient.addColorStop(0.2, "#ff69b4");
              gradient.addColorStop(0.4, "#9932cc");
              gradient.addColorStop(0.6, "#0000ff");
              gradient.addColorStop(0.8, "#00ffff");
              gradient.addColorStop(1, "#32cd32");
            }

            // Draw enhanced wave with rhythm detection
            const barWidth = canvasWidth / dataArray.length;
            const centerY = canvasHeight / 2;

            for (let i = 0; i < dataArray.length; i++) {
              let barHeight = (dataArray[i] / 255) * (canvasHeight * 0.9);

              // Apply energy multiplier for stronger response
              barHeight *= energyMultiplier;

              // Add rhythm enhancement based on frequency range
              if (i < bassEnd) {
                // Bass frequencies - slower, bigger waves
                barHeight *= 1 + bassAvg / 100;
              } else if (i < midEnd) {
                // Mid frequencies - balanced response
                barHeight *= 1 + midAvg / 150;
              } else {
                // Treble frequencies - faster, sharper response
                barHeight *= 1 + trebleAvg / 200;
              }

              // Limit maximum height
              barHeight = Math.min(barHeight, canvasHeight * 0.9);

              const x = i * barWidth;

              // Create multiple layers with enhanced effects
              for (let layer = 0; layer < 4; layer++) {
                const layerOffset = layer * 1.5;
                const layerHeight = barHeight * (1 - layer * 0.15);
                const layerAlpha =
                  (1 - layer * 0.2) * Math.min(energyMultiplier, 1.5);

                waveCtx.fillStyle = gradient;
                waveCtx.globalAlpha = layerAlpha;
                waveCtx.fillRect(
                  x + layerOffset,
                  centerY - layerHeight / 2,
                  Math.max(barWidth - 1, 1),
                  layerHeight
                );
              }
            }

            // Add dynamic glow effect based on energy
            const glowIntensity = Math.min(totalEnergy / 30, 15);
            waveCtx.shadowColor = "#ffffff";
            waveCtx.shadowBlur = glowIntensity;
            waveCtx.globalAlpha = 0.4 * Math.min(energyMultiplier, 2);

            // Redraw with enhanced glow
            for (let i = 0; i < dataArray.length; i++) {
              let barHeight = (dataArray[i] / 255) * (canvasHeight * 0.9);
              barHeight *= energyMultiplier;

              if (i < bassEnd) barHeight *= 1 + bassAvg / 100;
              else if (i < midEnd) barHeight *= 1 + midAvg / 150;
              else barHeight *= 1 + trebleAvg / 200;

              barHeight = Math.min(barHeight, canvasHeight * 0.9);
              const x = i * barWidth;

              waveCtx.fillStyle = gradient;
              waveCtx.fillRect(
                x,
                centerY - barHeight / 2,
                Math.max(barWidth - 1, 1),
                barHeight
              );
            }

            // Add center pulse effect for bass
            if (bassAvg > 30) {
              const pulseRadius = (bassAvg / 255) * 20 * energyMultiplier;
              const pulseAlpha = Math.min(bassAvg / 100, 0.6);

              waveCtx.shadowBlur = 20;
              waveCtx.globalAlpha = pulseAlpha;
              waveCtx.fillStyle = "#ff4444";
              waveCtx.beginPath();
              waveCtx.arc(
                canvasWidth / 2,
                centerY,
                pulseRadius,
                0,
                Math.PI * 2
              );
              waveCtx.fill();
            }

            // Reset shadow and alpha
            waveCtx.shadowBlur = 0;
            waveCtx.globalAlpha = 1;

            animationId = requestAnimationFrame(drawWave);
          } catch (error) {
            console.warn("⚠️ Audio analysis failed, using fallback:", error);
            drawFallbackWave();
          }
        }

        // Fallback wave animation without audio data
        function drawFallbackWave() {
          const canvasWidth = waveCanvas.getBoundingClientRect().width;
          const canvasHeight = waveCanvas.getBoundingClientRect().height;

          // Clear canvas with fade effect
          waveCtx.fillStyle = "rgba(0, 0, 0, 0.1)";
          waveCtx.fillRect(0, 0, canvasWidth, canvasHeight);

          // Create dynamic gradient that changes over time
          const time = Date.now() * 0.002;
          const gradient = waveCtx.createLinearGradient(0, 0, canvasWidth, 0);

          // Animate gradient colors
          const hue1 = (Math.sin(time) * 30 + 330) % 360;
          const hue2 = (Math.sin(time + 2) * 30 + 60) % 360;
          const hue3 = (Math.sin(time + 4) * 30 + 180) % 360;

          gradient.addColorStop(0, `hsl(${hue1}, 100%, 50%)`);
          gradient.addColorStop(0.5, `hsl(${hue2}, 100%, 50%)`);
          gradient.addColorStop(1, `hsl(${hue3}, 100%, 50%)`);

          // Create more complex animated wave pattern
          const numBars = 128;
          const barWidth = canvasWidth / numBars;
          const centerY = canvasHeight / 2;

          for (let i = 0; i < numBars; i++) {
            // Create multiple wave patterns with different frequencies
            const wave1 = Math.sin(time + i * 0.08) * 0.4;
            const wave2 = Math.sin(time * 1.7 + i * 0.15) * 0.3;
            const wave3 = Math.sin(time * 0.6 + i * 0.03) * 0.2;
            const wave4 = Math.sin(time * 2.3 + i * 0.25) * 0.1;

            // Add rhythm simulation
            const beat = Math.sin(time * 2) > 0.8 ? 1.5 : 1;
            const barHeight =
              (wave1 + wave2 + wave3 + wave4 + 1) * canvasHeight * 0.6 * beat;
            const x = i * barWidth;

            // Create enhanced layers for depth effect
            for (let layer = 0; layer < 5; layer++) {
              const layerOffset = layer * 1.2;
              const layerHeight = barHeight * (1 - layer * 0.12);
              const layerAlpha = (1 - layer * 0.15) * 0.8;

              waveCtx.fillStyle = gradient;
              waveCtx.globalAlpha = layerAlpha;
              waveCtx.fillRect(
                x + layerOffset,
                centerY - layerHeight / 2,
                Math.max(barWidth - 1, 1),
                layerHeight
              );
            }
          }

          // Add dynamic glow effect
          const glowIntensity = 8 + Math.sin(time * 3) * 5;
          waveCtx.shadowColor = "#ffffff";
          waveCtx.shadowBlur = glowIntensity;
          waveCtx.globalAlpha = 0.4;

          // Redraw with glow
          for (let i = 0; i < numBars; i++) {
            const wave1 = Math.sin(time + i * 0.08) * 0.4;
            const wave2 = Math.sin(time * 1.7 + i * 0.15) * 0.3;
            const wave3 = Math.sin(time * 0.6 + i * 0.03) * 0.2;
            const wave4 = Math.sin(time * 2.3 + i * 0.25) * 0.1;

            const beat = Math.sin(time * 2) > 0.8 ? 1.5 : 1;
            const barHeight =
              (wave1 + wave2 + wave3 + wave4 + 1) * canvasHeight * 0.6 * beat;
            const x = i * barWidth;

            waveCtx.fillStyle = gradient;
            waveCtx.fillRect(
              x,
              centerY - barHeight / 2,
              Math.max(barWidth - 1, 1),
              barHeight
            );
          }

          // Add center pulse effect
          const pulseRadius = 15 + Math.sin(time * 4) * 10;
          const pulseAlpha = 0.3 + Math.sin(time * 6) * 0.2;

          waveCtx.shadowBlur = 25;
          waveCtx.globalAlpha = pulseAlpha;
          waveCtx.fillStyle = `hsl(${(hue1 + hue2) / 2}, 100%, 70%)`;
          waveCtx.beginPath();
          waveCtx.arc(canvasWidth / 2, centerY, pulseRadius, 0, Math.PI * 2);
          waveCtx.fill();

          // Reset shadow and alpha
          waveCtx.shadowBlur = 0;
          waveCtx.globalAlpha = 1;

          animationId = requestAnimationFrame(drawFallbackWave);
        }

        // Utility: try to play a video with retries and AudioContext resume attempt
        async function tryAutoplay(video, idLabel = "video") {
          if (!video) return false;

          // Ensure attributes that help autoplay
          video.muted = true;
          video.playsInline = true;
          video.autoplay = true;

          // Try direct play with retries
          for (let i = 0; i < retryDelays.length; i++) {
            try {
              await video.play();
              console.log(`✅ [${idLabel}] play succeeded (attempt ${i + 1})`);
              return true;
            } catch (err) {
              console.warn(
                `⚠️ [${idLabel}] play attempt ${i + 1} failed:`,
                err
              );

              // Try to resume WebAudio context (some browsers require it)
              try {
                const AudioCtx =
                  window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                  const ctx = new AudioCtx();
                  if (ctx.state === "suspended") {
                    await ctx.resume();
                    console.log(`🎛️ AudioContext resumed for ${idLabel}`);
                  }
                }
              } catch (e) {
                // ignore
              }

              await new Promise((r) => setTimeout(r, retryDelays[i]));
            }
          }

          console.warn(`❌ [${idLabel}] autoplay not allowed after retries`);
          return false;
        }

        // Magical Text Animation - Random Movement Across Viewport
        function setupCircularText() {
          const circularText = document.getElementById("circularText");
          const words = circularText.querySelectorAll(".circular-word");

          // Get profile card boundaries
          function getProfileCardBounds() {
            const profileCard = document.querySelector(".profile-card");
            if (!profileCard) return null;

            const rect = profileCard.getBoundingClientRect();
            return {
              left: rect.left - 50, // Add margin
              right: rect.right + 50,
              top: rect.top - 50,
              bottom: rect.bottom + 50,
            };
          }

          // Check if position is outside profile card
          function isOutsideProfileCard(x, y, bounds) {
            if (!bounds) return true;
            return (
              x < bounds.left ||
              x > bounds.right ||
              y < bounds.top ||
              y > bounds.bottom
            );
          }

          // Get random position outside profile card
          function getRandomPositionOutsideProfileCard() {
            const bounds = getProfileCardBounds();
            let attempts = 0;
            const maxAttempts = 100;

            while (attempts < maxAttempts) {
              const x = Math.random() * (window.innerWidth - 100);
              const y = Math.random() * (window.innerHeight - 100);

              if (isOutsideProfileCard(x, y, bounds)) {
                return { x, y };
              }
              attempts++;
            }

            // Fallback: position at edges
            const edges = [
              { x: 50, y: Math.random() * (window.innerHeight - 100) }, // Left edge
              {
                x: window.innerWidth - 150,
                y: Math.random() * (window.innerHeight - 100),
              }, // Right edge
              { x: Math.random() * (window.innerWidth - 100), y: 50 }, // Top edge
              {
                x: Math.random() * (window.innerWidth - 100),
                y: window.innerHeight - 150,
              }, // Bottom edge
            ];
            return edges[Math.floor(Math.random() * edges.length)];
          }

          // Thiết lập vị trí ban đầu ngẫu nhiên ngoài profile-card
          words.forEach((word, index) => {
            const pos = getRandomPositionOutsideProfileCard();
            word.style.left = pos.x + "px";
            word.style.top = pos.y + "px";

            // Thêm hiệu ứng hover ảo diệu
            word.addEventListener("mouseenter", () => {
              word.style.filter = "brightness(1.5) blur(2px)";
              word.style.transform = "scale(1.5) rotate(360deg)";
              word.style.zIndex = "100";
            });

            word.addEventListener("mouseleave", () => {
              word.style.filter = "";
              word.style.transform = "";
              word.style.zIndex = "";
            });

            // Click để di chuyển ngẫu nhiên ngoài profile-card
            word.addEventListener("click", () => {
              const pos = getRandomPositionOutsideProfileCard();
              word.style.left = pos.x + "px";
              word.style.top = pos.y + "px";

              // Hiệu ứng click
              word.style.transform = "scale(0.8) rotate(180deg)";
              setTimeout(() => {
                word.style.transform = "";
              }, 300);
            });
          });

          // Continuous movement for MN and HC
          let animationId;
          let wordTargets = new Map(); // Store target positions for each word

          function setRandomTarget(word) {
            const text = word.textContent;
            if (text === "Chy Gà" || text === "18 Tuổi") {
              const pos = getRandomPositionOutsideProfileCard();
              wordTargets.set(word, { x: pos.x, y: pos.y });
            }
          }

          function continuousMovement() {
            words.forEach((word) => {
              const text = word.textContent;

              // Only apply continuous movement to Chy Gà and 18 Tuổi
              if (text === "Chy Gà" || text === "18 Tuổi") {
                const currentX = parseInt(word.style.left) || 0;
                const currentY = parseInt(word.style.top) || 0;

                // Get or set target position
                if (!wordTargets.has(word)) {
                  setRandomTarget(word);
                }

                const target = wordTargets.get(word);
                const targetX = target.x;
                const targetY = target.y;

                // Calculate direction to target
                const deltaX = targetX - currentX;
                const deltaY = targetY - currentY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                // If reached target or very close, set new target
                if (distance < 10) {
                  setRandomTarget(word);
                  return;
                }

                // Move towards target with smooth speed
                const speed = 1.5; // Adjust speed here
                const moveX = (deltaX / distance) * speed;
                const moveY = (deltaY / distance) * speed;

                let newX = currentX + moveX;
                let newY = currentY + moveY;

                // Keep within viewport bounds
                newX = Math.max(0, Math.min(newX, window.innerWidth - 100));
                newY = Math.max(0, Math.min(newY, window.innerHeight - 100));

                // Check if new position is outside profile card
                const bounds = getProfileCardBounds();
                if (isOutsideProfileCard(newX, newY, bounds)) {
                  word.style.left = newX + "px";
                  word.style.top = newY + "px";
                } else {
                  // If would enter profile card, set new target away from profile card
                  setRandomTarget(word);
                  return;
                }

                // Gentle rotation - smooth and slow
                const currentRotate =
                  parseInt(
                    word.style.transform.match(/rotate\((-?\d+)deg\)/) || [0, 0]
                  )[1] || 0;
                const newRotate = (currentRotate + 0.3) % 360; // Very slow rotation: 0.3 degrees per frame
                word.style.transform = `rotate(${newRotate}deg)`;
              } else {
                // For other words (-), use interval-based movement
                if (Math.random() < 0.3) {
                  const currentX = parseInt(word.style.left) || 0;
                  const currentY = parseInt(word.style.top) || 0;

                  const moveX = (Math.random() - 0.5) * 100;
                  const moveY = (Math.random() - 0.5) * 100;

                  let newX = currentX + moveX;
                  let newY = currentY + moveY;

                  newX = Math.max(0, Math.min(newX, window.innerWidth - 100));
                  newY = Math.max(0, Math.min(newY, window.innerHeight - 100));

                  const bounds = getProfileCardBounds();
                  if (isOutsideProfileCard(newX, newY, bounds)) {
                    word.style.left = newX + "px";
                    word.style.top = newY + "px";
                  }
                }
              }
            });

            animationId = requestAnimationFrame(continuousMovement);
          }

          // Start continuous movement
          continuousMovement();

          // Stop continuous movement when page is hidden
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
              cancelAnimationFrame(animationId);
            } else {
              continuousMovement();
            }
          });
        }

            { colors: ["#6BCF7F", "#00F2FE"], name: "Green-Cyan" },
            { colors: ["#FEC163", "#FF6B9D"], name: "Orange-Pink" },
          ];

          // Helper function to interpolate between two hex colors
          function interpolateColor(color1, color2, ratio) {
            const hex = (color) => {
              const c = color.replace("#", "");
              return {
                r: parseInt(c.substr(0, 2), 16),
                g: parseInt(c.substr(2, 2), 16),
                b: parseInt(c.substr(4, 2), 16),
              };
            };

            const c1 = hex(color1);
            const c2 = hex(color2);

            const r = Math.round(c1.r + (c2.r - c1.r) * ratio);
            const g = Math.round(c1.g + (c2.g - c1.g) * ratio);
            const b = Math.round(c1.b + (c2.b - c1.b) * ratio);

            return `#${r.toString(16).padStart(2, "0")}${g
              .toString(16)
              .padStart(2, "0")}${b.toString(16).padStart(2, "0")}`;
          }

          function resetAnimation() {
            // Choose random direction for this cycle
            const randomDirection =
              directions[Math.floor(Math.random() * directions.length)];

            // Choose random gradient for this cycle
            const randomGradient =
              gradients[Math.floor(Math.random() * gradients.length)];
            const gradientStart = randomGradient.colors[0];
            const gradientEnd = randomGradient.colors[1];

            chars.forEach((char, index) => {
              char.style.animation = "none";
              char.style.opacity = "0";

              // Calculate gradient color for this character
              const totalChars = chars.length;
              const ratio = index / (totalChars - 1);

              // Interpolate between gradient start and end colors
              const color = interpolateColor(gradientStart, gradientEnd, ratio);
              char.style.color = color;
              char.style.textShadow = `0 0 20px ${color}80, 0 0 40px ${color}40, 0 0 60px ${color}20`;

              // Set initial position based on direction
              switch (randomDirection) {

                  break;

                  break;
                case "charSlideFromBottom":
                  char.style.transform = "translateY(100px) scale(0.5)";
                  break;
              }

              // Force reflow
              char.offsetHeight;

              // Restart animation with shorter delay
              setTimeout(() => {
                char.style.animation = `${randomDirection} 0.6s ease-out forwards`;
                char.style.animationDelay = `${index * 0.08}s`; // Reduced from 0.2s to 0.08s
              }, 50);
            });
          }

          // Start initial animation
          resetAnimation();

          // Repeat animation every 5 seconds (reduced from 8s)

            resetAnimation();

                manhkiuc.audioTracks?.length || "N/A"
              );
              console.log(
                "📊 Text tracks:",
                manhkiuc.textTracks?.length || "N/A"
              );
            });

            console.log("🎵 Video setup complete");
          }

          // Handle window resize
          window.addEventListener("resize", initCanvas);

          // Handle window resize for text positioning
          window.addEventListener("resize", () => {
            const words = document.querySelectorAll(".circular-word");
            words.forEach((word) => {
              const currentX = parseInt(word.style.left) || 0;
              const currentY = parseInt(word.style.top) || 0;

              // Adjust position if outside new viewport
              let newX = Math.max(
                0,
                Math.min(currentX, window.innerWidth - 100)
              );
              let newY = Math.max(
                0,
                Math.min(currentY, window.innerHeight - 100)
              );

              word.style.left = newX + "px";
              word.style.top = newY + "px";
            });
          });
        });

        // Fallback overlay behavior
        function showOverlayFallback() {
          if (!overlay) return;
          overlay.style.display = "flex";
          overlay.setAttribute("aria-hidden", "false");

          // Play + unmute
          btnPlayUnmute.addEventListener("click", async () => {
            try {
              // Resume audio context first (some mobile browsers)
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) {
                const ctx = new AudioCtx();
                if (ctx.state === "suspended") {
                  await ctx.resume();
                }
              }
            } catch (e) {
              /* ignore */
            }

            // Play music video
            if (manhkiuc) {
              try {
                manhkiuc.muted = false;
                manhkiuc.volume = 0.6;
                await manhkiuc.play();
              } catch (e) {
                // if direct unmute fails, try muted play then unmute
                try {
                  manhkiuc.muted = true;
                  await manhkiuc.play();
                  manhkiuc.muted = false;
                } catch (e2) {
                  console.warn("❌ play/unmute still failed", e2);
                }
              }
            }

            hideOverlay();
          });

          // Play muted (no sound)
          btnPlayMuted.addEventListener("click", async () => {
            if (manhkiuc) {
              try {
                manhkiuc.muted = true;
                await manhkiuc.play();
              } catch (e) {}
            }
            hideOverlay();
          });

          // Also allow any first user gesture anywhere to trigger play (convenience)
          function onFirstGesture() {
            if (manhkiuc) {
              manhkiuc.muted = true;
              manhkiuc.play().catch(() => {});
            }
            hideOverlay();
            removeGestureListeners();
          }
          function removeGestureListeners() {
            ["click", "touchstart", "keydown"].forEach((ev) =>
              document.removeEventListener(ev, onFirstGesture)
            );
          }
          ["click", "touchstart", "keydown"].forEach((ev) =>
            document.addEventListener(ev, onFirstGesture, { once: true })
          );
        }

        function hideOverlay() {
          if (!overlay) return;
          overlay.style.display = "none";
          overlay.setAttribute("aria-hidden", "true");
        }

        // Removed: document click listener that was causing duplicate audio playback

        // Make sure cursor image is set (original behavior)
        document.body.style.cursor =
          "url(https://r2.guns.lol/d65efee2-e2af-42e5-b2f4-63ecf4fb1afd.png) 16 16, auto";

        // Shooting Stars (kept same)
        function createShootingStar() {
          const star = document.createElement("div");
          star.classList.add("shooting-star");
          star.style.left = Math.random() * 100 + "vw";
          star.style.top = Math.random() * 100 + "vh";
          const size = 4 + Math.random() * 3;
          star.style.width = size + "px";
          star.style.height = size + "px";
          star.style.animationDuration = "2s";
          star.style.opacity = 0.7 + Math.random() * 0.3;
          document.body.appendChild(star);
          setTimeout(() => star.remove(), 2000);
        }
        for (let i = 0; i < 10; i++) {
          setTimeout(() => createShootingStar(), i * 2000);
        }
        setInterval(createShootingStar, 2000);

        // Play Video Function with immediate sound
        function playVideo() {
          const video = document.getElementById("manhkiuc");
          if (video) {
            console.log("🎵 Manual play function called");

            // Set video properties for immediate sound
            video.muted = false;
            video.volume = 0.8;
            video.autoplay = true;
            video.playsInline = true;

            // Strategy 1: Try immediate unmuted play
            video
              .play()
              .then(() => {
                console.log("✅ Video started playing with SOUND!");
                video.muted = false;
                video.volume = 0.8;

                // Update UI state
                isPlaying = true;
                isMuted = false;

                // Start wave animation
                startWaveAnimation();
              })
              .catch((e) => {
                console.log("❌ Unmuted play failed:", e);

                // Strategy 2: Use user interaction to enable sound
                enableSoundWithUserInteraction(video);
              });
          }
        }

        // Enable sound using user interaction
        function enableSoundWithUserInteraction(video) {
          console.log("🎯 Enabling sound with user interaction...");

          // Create a real clickable element
          const soundButton = document.createElement("div");
          soundButton.innerHTML = "🔊";

            position: fixed;

            justify-content: center;

            z-index: 10000;
            border: 3px solid #ff6b6b;

          `;

          soundButton.onclick = () => {

            video.muted = false;

              // Update UI state
              isPlaying = true;

          document.body.appendChild(soundButton);

          // Auto-click the sound button immediately
          soundButton.click();

        }

        // Simulate user gesture for autoplay
        function simulateUserGesture(video) {
          console.log("🎯 Simulating user gesture...");

          // Create and dispatch multiple events
          const events = [
            "mousedown",
            "mouseup",
            "click",
            "touchstart",
            "touchend",
          ];

          events.forEach((eventType, index) => {
            const event = new Event(eventType, { bubbles: true });
            video.dispatchEvent(event);
            console.log(`🎯 Dispatched ${eventType} event`);
          });

          // Try to play immediately after all events
          video
            .play()
            .then(() => {
              console.log("✅ Video played after gesture simulation");
              video.muted = false;
              video.volume = 0.5;
            })
            .catch((e) => {
              console.log("❌ Gesture simulation failed:", e);
            });
        }

        function tryWebAudioBypass() {

          try {

              window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();

            oscillator.connect(gainNode);
