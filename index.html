<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>click to enter...</title>
    <meta property="og:title" content="click to enter..." />
    <meta property="og:description" content="❄️ click to enter..." />
    <meta property="og:image" content="https://i.imgur.com/JUO5n2r.png" />
    <!-- ảnh preview -->
    <meta property="theme-color" content="#000000" />
    <style>
      body {
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        margin: 0;
        overflow: hidden;
      }
      .header-name {
        position: absolute;
        top: 30px;
        font-size: 3rem;
        font-weight: bold;
        background: linear-gradient(45deg, #ff6ec4, #7873f5, #4facfe, #00f2fe);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradient 3s ease infinite, glow 2s ease-in-out infinite;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        z-index: 10;
      }
      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      @keyframes glow {
        0%,
        100% {
          filter: drop-shadow(0 0 10px rgba(255, 110, 196, 0.7));
        }
        50% {
          filter: drop-shadow(0 0 25px rgba(120, 115, 245, 0.9));
        }
      }
      .content {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.05);
          opacity: 0.8;
        }
      }
      .snowflake {
        position: absolute;
        color: white;
        font-size: 1.5em;
        animation: fall linear forwards;
        pointer-events: none;
      }
      @keyframes fall {
        0% {
          transform: translateY(-10vh) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="header-name">Nguyễn Thị Huyền Chi</div>
    <div class="content">click to enter...</div>
    <script>
      // Tạo bông tuyết không giới hạn
      function createSnowflake() {
        const flake = document.createElement("div");
        flake.classList.add("snowflake");
        flake.textContent = "❄";
        flake.style.left = Math.random() * 100 + "vw";
        flake.style.animationDuration = 3 + Math.random() * 4 + "s";
        flake.style.fontSize = 0.5 + Math.random() * 1.5 + "em";
        document.body.appendChild(flake);

        // Xóa bông tuyết sau khi rơi xong để tránh tràn bộ nhớ
        setTimeout(() => {
          flake.remove();
        }, (3 + Math.random() * 4) * 1000);
      }

      // Tạo bông tuyết ban đầu
      for (let i = 0; i < 20; i++) {
        setTimeout(() => createSnowflake(), i * 200);
      }

      // Tạo bông tuyết mới liên tục
      setInterval(createSnowflake, 300);
    </script>
  </body>
</html>
