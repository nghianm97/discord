<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Huyền Chi | Profile</title>
    <meta name="description" content="Trang cá nhân của Huyền Chi" />
    <meta property="og:title" content="@Huyền Chi | Profile" />
    <meta
      property="og:description"
      content="Trang cá nhân của Nguyễn Thị Huyền Chi"
    />
    <meta property="theme-color" content="#ffffff" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #000;
        color: #fff;
        height: 100vh; /* Fallback for older browsers */
        height: 100dvh;
        max-height: 100vh; /* Fallback for older browsers */
        max-height: 100dvh;
        overflow: hidden;
        position: relative;
        scroll-behavior: smooth;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Background Video */
      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
      }

      /* Header Name - Running Text */
      .header-name {
        position: fixed;
        top: 25%;
        left: 0;
        width: 100%;
        font-size: 4rem;
        font-weight: 700;
        background: linear-gradient(
          45deg,
          #ff6ec4,
          #7873f5,
          #4facfe,
          #00f2fe,
          #ff6ec4,
          #ff9a56,
          #ff6ec4
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: gradientFlow 6s ease-in-out infinite,
          runningText 8s linear infinite;
        z-index: 100;
        text-align: center;
        text-shadow: 0 0 40px rgba(255, 110, 196, 0.6);
        letter-spacing: 3px;
        filter: drop-shadow(0 0 20px rgba(120, 115, 245, 0.8));
        transition: all 0.3s ease;
        white-space: nowrap;
      }

      .header-name:hover {
        animation-play-state: paused;
        text-shadow: 0 0 60px rgba(255, 255, 255, 0.9);
        filter: drop-shadow(0 0 30px rgba(255, 110, 196, 1));
      }

      @keyframes gradientFlow {
        0% {
          background-position: 0% 50%;
          filter: hue-rotate(0deg);
        }
        25% {
          background-position: 100% 50%;
          filter: hue-rotate(90deg);
        }
        50% {
          background-position: 100% 100%;
          filter: hue-rotate(180deg);
        }
        75% {
          background-position: 0% 100%;
          filter: hue-rotate(270deg);
        }
        100% {
          background-position: 0% 50%;
          filter: hue-rotate(360deg);
        }
      }

      /* Poem Animation */
      .poem-line {
        position: fixed;
        font-size: clamp(8px, 1.2vw, 15px);
        font-weight: 900;
        font-style: italic;
        background: linear-gradient(
          45deg,
          #ff6ec4,
          #7873f5,
          #4facfe,
          #00f2fe,
          #ff9a9e
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 60px rgba(255, 110, 196, 0.8);
        letter-spacing: clamp(0.5px, 0.2vw, 1px);
        opacity: 0;
        transform: scale(0.3) rotate(-20deg);
        transition: all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        pointer-events: none;
        z-index: 10001;
        filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
        text-align: center;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .poem-line.show {
        opacity: 1;
        transform: scale(1.3) rotate(var(--random-rotation, 8deg));
        animation: poemGlow 2s ease-in-out infinite alternate,
          poemFloat 3s ease-in-out infinite;
      }

      .poem-line.hide {
        opacity: 0;
        transform: scale(0.2) rotate(-25deg);
      }

      @keyframes poemGlow {
        0% {
          text-shadow: 0 0 60px rgba(255, 110, 196, 0.8),
            0 0 80px rgba(120, 115, 245, 0.6), 0 0 100px rgba(79, 172, 254, 0.4);
        }
        100% {
          text-shadow: 0 0 80px rgba(255, 110, 196, 1),
            0 0 100px rgba(120, 115, 245, 0.8),
            0 0 120px rgba(79, 172, 254, 0.6);
        }
      }

      @keyframes poemFloat {
        0%,
        100% {
          transform: scale(1.3) rotate(var(--random-rotation, 8deg))
            translateY(0px);
        }
        50% {
          transform: scale(1.4)
            rotate(calc(var(--random-rotation, 8deg) + 4deg)) translateY(-10px);
        }
      }

      @keyframes runningText {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* Main Container */
      .container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh; /* Fallback for older browsers */
        height: 100dvh;
        max-height: 100vh; /* Fallback for older browsers */
        max-height: 100dvh;
        padding: 150px 20px 50px;
        box-sizing: border-box;
      }

      /* Profile Card */
      .profile-card {
        border-radius: 25px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        animation: fadeIn 1s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Avatar */
      .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: 0 auto 25px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        animation: pulse 3s ease-in-out infinite;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-size: 4rem;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Username */
      .username {
        font-size: 2.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 15px;
        color: #fff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }

      /* Entry Text */
      .entry-text {
        text-align: center;
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 30px;
        animation: blink 2s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Social Icons */
      .socials {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
        flex-wrap: wrap;
      }

      .social-icon {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #fff;
        font-size: 1.8rem;
        transition: all 0.3s ease;
        cursor: pointer;
        animation: socialFloat 3s ease-in-out infinite,
          socialPulse 2s ease-in-out infinite;
      }

      .social-icon:hover {
        background: rgba(255, 255, 255, 0.25);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-5px) scale(1.1);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
        animation-play-state: paused;
      }

      /* Social Icon Animations */
      @keyframes socialFloat {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        25% {
          transform: translateY(-8px) rotate(1deg);
        }
        50% {
          transform: translateY(-12px) rotate(0deg);
        }
        75% {
          transform: translateY(-8px) rotate(-1deg);
        }
      }

      @keyframes socialPulse {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
          background: rgba(255, 255, 255, 0.15);
        }
        50% {
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
          background: rgba(255, 255, 255, 0.25);
        }
      }

      /* Individual icon animations */
      .social-icon:nth-child(1) {
        animation-delay: 0s;
        animation: socialFloat 3s ease-in-out infinite,
          socialPulse 2s ease-in-out infinite,
          socialGlow 4s ease-in-out infinite;
      }

      .social-icon:nth-child(2) {
        animation-delay: 1.5s;
        animation: socialFloat 3s ease-in-out infinite,
          socialPulse 2s ease-in-out infinite,
          socialGlow 4s ease-in-out infinite;
      }

      @keyframes socialGlow {
        0%,
        100% {
          filter: brightness(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }
        25% {
          filter: brightness(1.2) drop-shadow(0 0 10px rgba(79, 172, 254, 0.5));
        }
        50% {
          filter: brightness(1.4) drop-shadow(0 0 15px rgba(255, 110, 196, 0.6));
        }
        75% {
          filter: brightness(1.2) drop-shadow(0 0 10px rgba(120, 115, 245, 0.5));
        }
      }

      /* Shooting Stars */
      .shooting-star {
        position: fixed;
        width: 5px;
        height: 5px;
        background: #fff;
        border-radius: 50%;
        pointer-events: none;
        z-index: 50;
        animation: shoot 2s linear forwards, glow 0.8s ease-in-out infinite;
        user-select: none;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      }

      /* Star trail */
      .shooting-star::before {
        content: "";
        position: absolute;
        top: 50%;
        left: -50px;
        width: 50px;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent 0%,
          rgba(255, 255, 255, 0.8) 30%,
          rgba(255, 255, 255, 1) 70%,
          transparent 100%
        );
        transform: translateY(-50%);
        animation: trailFade 1s ease-out forwards;
      }

      @keyframes trailFade {
        0% {
          opacity: 1;
          transform: translateY(-50%) scaleX(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-50%) scaleX(0.3);
        }
      }

      @keyframes shoot {
        0% {
          transform: translateX(-10vw) translateY(-10vh);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateX(110vw) translateY(110vh);
          opacity: 0;
        }
      }

      @keyframes glow {
        0%,
        100% {
          box-shadow: 0 0 5px rgba(255, 255, 255, 0.6),
            0 0 10px rgba(255, 255, 255, 0.4), 0 0 15px rgba(255, 255, 255, 0.2);
        }
        50% {
          box-shadow: 0 0 10px rgba(255, 255, 255, 1),
            0 0 20px rgba(255, 255, 255, 0.8), 0 0 30px rgba(255, 255, 255, 0.6);
        }
      }

      /* Wave Visualizer */
      .wave-container {
        display: none;
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 10000;
        width: 300px;
        height: 120px;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 15px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }

      .wave-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Music Video Player - Visible */
      .music-video-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        z-index: 1000;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        width: 280px;
        height: 158px;
        opacity: 1;
        pointer-events: auto;
        backdrop-filter: blur(10px);
      }

      .music-video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
      }

      /* Hover effects for video container */
      .music-video-container:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        transition: all 0.3s ease;
      }

      .music-video-container:hover video {
        filter: brightness(1.1);
      }

      /* Responsive design for video container */
      @media (max-width: 768px) {
        .music-video-container {
          width: 200px;
          height: 113px;
          bottom: 20px;
          left: 50%;
          transform: translateX(-50%);
        }
      }

      @media (max-width: 480px) {
        .music-video-container {
          width: 150px;
          height: 85px;
          bottom: 15px;
          left: 50%;
          transform: translateX(-50%);
        }
      }

      /* Enter Overlay */
      .enter-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.8),
          rgba(26, 26, 46, 0.8),
          rgba(22, 33, 62, 0.8)
        );
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.8s ease, visibility 0.8s ease,
          backdrop-filter 0.8s ease;
      }

      .enter-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        backdrop-filter: blur(0px);
        -webkit-backdrop-filter: blur(0px);
      }

      .enter-overlay h1 {
        font-size: 4rem;
        font-weight: 700;
        background: linear-gradient(45deg, #ff6ec4, #7873f5, #4facfe, #00f2fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        margin-bottom: 20px;
        animation: gradientFlow 3s ease-in-out infinite;
        text-shadow: 0 0 40px rgba(255, 110, 196, 0.6);
        letter-spacing: 3px;
      }

      .enter-overlay p {
        font-size: 1.5rem;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        margin-bottom: 40px;
        animation: fadeInOut 2s ease-in-out infinite;
      }

      .enter-overlay .subtitle {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.6);
        text-align: center;
        animation: fadeInOut 2s ease-in-out infinite;
        animation-delay: 0.5s;
      }

      @keyframes fadeInOut {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }

      /* Video Control Buttons */
      .video-control-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: white;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        z-index: 10001;
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      .video-control-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translate(-50%, -50%) scale(1.15);
        border-color: rgba(255, 255, 255, 0.6);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
      }

      .video-control-btn:active {
        transform: translate(-50%, -50%) scale(1.05);
        background: rgba(255, 255, 255, 0.2);
      }

      /* Click to Play Overlay */
      .click-to-play-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10001;
        background: rgba(0, 0, 0, 0.8);
        padding: 30px 40px;
        border-radius: 20px;
        backdrop-filter: blur(15px);
        border: 2px solid rgba(255, 255, 255, 0.2);
        text-align: center;
        animation: pulseOverlay 2s ease-in-out infinite;
        cursor: pointer;
      }

      .click-to-play-overlay h3 {
        color: #fff;
        font-size: 1.5rem;
        margin-bottom: 10px;
        background: linear-gradient(45deg, #ff6ec4, #7873f5, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .click-to-play-overlay p {
        color: rgba(255, 255, 255, 0.8);
        font-size: 1rem;
        margin: 0;
      }

      @keyframes pulseOverlay {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.05);
          box-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
        }
      }

      /* Play fallback overlay (visible when autoplay blocked) */
      .play-overlay {
        position: fixed;
        bottom: 18px;
        left: 18px;
        z-index: 10001;
        display: none; /* shown only if autoplay blocked */
        gap: 8px;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px;
        border-radius: 10px;
      }
      .play-overlay button {
        background: linear-gradient(90deg, #ff6ec4, #7873f5);
        border: none;
        color: #fff;
        padding: 8px 12px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }
      .play-overlay .label {
        color: #fff;
        font-size: 0.9rem;
      }

      /* Responsive rules omitted for brevity (kept same as original) */
      @media (max-width: 1024px) {
        .header-name {
          font-size: 3rem;
          top: 15%;
          animation: gradientFlow 6s ease-in-out infinite,
            runningText 10s linear infinite;
        }

        .poem-line {
          font-size: clamp(8px, 1.1vw, 14px);
        }

        .wave-container {
          width: 280px;
          height: 110px;
        }

        .music-video-container {
          width: 260px;
          height: 146px;
          bottom: 20px;
          left: 50%;
          transform: translateX(-50%);
        }

        .video-control-btn {
          width: 40px;
          height: 40px;
          font-size: 14px;
        }

        .enter-overlay h1 {
          font-size: 3rem;
        }

        .enter-overlay p {
          font-size: 1.2rem;
        }
      }

      @media (max-width: 768px) {
        .header-name {
          font-size: 3rem;
          top: 5%;
          letter-spacing: 2px;
        }

        .container {
          padding: 80px 15px 20px;
        }

        .profile-card {
          padding: 25px 15px;
          max-width: 90%;
        }

        .username {
          font-size: 1.8rem;
        }

        .avatar {
          width: 100px;
          height: 100px;
          margin-bottom: 20px;
        }

        .entry-text {
          font-size: 1rem;
          margin-bottom: 25px;
        }

        .socials {
          gap: 15px;
          margin-top: 25px;
        }

        .social-icon {
          width: 50px;
          height: 50px;
          font-size: 1.5rem;
          animation: socialFloat 3s ease-in-out infinite,
            socialPulse 2s ease-in-out infinite;
        }

        .wave-container {
          width: 240px;
          height: 90px;
        }

        .music-video-container {
          bottom: 15px;
          left: 50%;
          transform: translateX(-50%);
          width: 220px;
          height: 124px;
        }

        .video-control-btn {
          width: 35px;
          height: 35px;
          font-size: 12px;
        }

        .enter-overlay h1 {
          font-size: 2.5rem;
        }

        .enter-overlay p {
          font-size: 1rem;
        }
      }

      @media (max-width: 480px) {
        .header-name {
          font-size: 2.5rem;
          top: 30%;
          letter-spacing: 1px;
        }

        .poem-line {
          font-size: clamp(8px, 1vw, 12px);
        }

        .container {
          padding: 60px 10px 15px;
        }

        .profile-card {
          padding: 20px 10px;
          max-width: 95%;
        }

        .avatar {
          width: 80px;
          height: 80px;
          margin-bottom: 15px;
        }

        .entry-text {
          font-size: 0.9rem;
          margin-bottom: 20px;
        }

        .socials {
          gap: 12px;
          margin-top: 20px;
        }

        .social-icon {
          width: 45px;
          height: 45px;
          font-size: 1.3rem;
          animation: socialFloat 3s ease-in-out infinite,
            socialPulse 2s ease-in-out infinite;
        }

        .wave-container {
          width: 200px;
          height: 80px;
        }

        .music-video-container {
          bottom: 10px;
          left: 50%;
          transform: translateX(-50%);
          width: 180px;
          height: 101px;
        }

        .video-control-btn {
          width: 30px;
          height: 30px;
          font-size: 11px;
        }

        .enter-overlay h1 {
          font-size: 2rem;
        }

        .enter-overlay p {
          font-size: 0.9rem;
        }
      }

      @media (max-width: 360px) {
        .header-name {
          font-size: 2rem;
          top: 2%;
        }

        .poem-line {
          font-size: clamp(8px, 0.9vw, 10px);
        }

        .container {
          padding: 50px 5px 10px;
        }

        .profile-card {
          padding: 15px 8px;
          max-width: 98%;
        }

        .avatar {
          width: 70px;
          height: 70px;
        }

        .entry-text {
          font-size: 0.8rem;
        }

        .social-icon {
          width: 40px;
          height: 40px;
          font-size: 1.1rem;
          animation: socialFloat 3s ease-in-out infinite,
            socialPulse 2s ease-in-out infinite;
        }

        .wave-container {
          width: 170px;
          height: 70px;
        }

        .music-video-container {
          width: 160px;
          height: 90px;
          bottom: 10px;
          left: 50%;

    <script>
      (function () {
        // Elements
        const bgVideo = document.getElementById("bgVideo");
        const manhkiuc = document.getElementById("manhkiuc");
        const overlay = document.getElementById("playOverlay");
        const btnPlayUnmute = document.getElementById("playUnmuteBtn");
        const btnPlayMuted = document.getElementById("playMutedBtn");

        // Wave Visualizer Elements
        const waveCanvas = document.getElementById("waveCanvas");
        const waveCtx = waveCanvas.getContext("2d");
        const enterOverlay = document.getElementById("enterOverlay");

        // Audio Analysis
        let audioContext = null;
        let analyser = null;
        let source = null;
        let dataArray = null;
        let animationId = null;
        let isPlaying = false;
        let isMuted = false;
        let musicStarted = false;
        let audioSourceConnected = false;

        // Initialize canvas
        function initCanvas() {
          const rect = waveCanvas.getBoundingClientRect();
          waveCanvas.width = rect.width * window.devicePixelRatio;
          waveCanvas.height = rect.height * window.devicePixelRatio;
          waveCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
          waveCanvas.style.width = rect.width + "px";
          waveCanvas.style.height = rect.height + "px";
        }

        // Poem Animation
        let currentPoemLine = 0;
        let poemAnimationInterval = null;

        function startPoemAnimation() {
          console.log("📝 Starting poem animation...");

          const poemLines = document.querySelectorAll(".poem-line");
          if (poemLines.length === 0) return;

          currentPoemLine = 0;
          showPoemLine(currentPoemLine);
        }

        function showPoemLine(lineIndex) {
          const poemLines = document.querySelectorAll(".poem-line");
          if (lineIndex >= poemLines.length) {
            // Animation finished, restart
            setTimeout(() => {
              startPoemAnimation();
            }, 1000);
            return;
          }

          const currentLine = poemLines[lineIndex];

          // Calculate available space (90% of viewport to ensure text fits)
          const availableWidth = window.innerWidth * 0.9;
          const availableHeight = window.innerHeight * 0.9;

          // Get text width to ensure it fits
          const tempSpan = document.createElement("span");
          tempSpan.style.fontSize =
            currentLine.style.fontSize ||
            getComputedStyle(currentLine).fontSize;
          tempSpan.style.fontFamily = getComputedStyle(currentLine).fontFamily;
          tempSpan.style.fontWeight = getComputedStyle(currentLine).fontWeight;
          tempSpan.style.visibility = "hidden";
          tempSpan.style.position = "absolute";
          tempSpan.textContent = currentLine.textContent;
          document.body.appendChild(tempSpan);

          const textWidth = tempSpan.offsetWidth;
          const textHeight = tempSpan.offsetHeight;
          document.body.removeChild(tempSpan);

          // Random position ensuring text fits within viewport
          const maxX = Math.max(0, availableWidth - textWidth);
          const maxY = Math.max(0, availableHeight - textHeight);

          const randomX = Math.random() * maxX;
          const randomY = Math.random() * maxY;

          // Set position using percentage for better responsiveness
          currentLine.style.left = (randomX / window.innerWidth) * 100 + "%";
          currentLine.style.top = (randomY / window.innerHeight) * 100 + "%";

          // Random rotation for variety (horizontal, vertical, diagonal)
          const rotationAngles = [
            0, 90, -90, 180, 45, -45, 135, -135, 30, -30, 60, -60,
          ];
          const randomRotation =
            rotationAngles[Math.floor(Math.random() * rotationAngles.length)];

          // Apply random rotation to the element
          currentLine.style.setProperty(
            "--random-rotation",
            randomRotation + "deg"
          );

          // Show line
          currentLine.classList.remove("hide");
          currentLine.classList.add("show");

          console.log(
            `📝 Showing line ${lineIndex + 1}: "${
              currentLine.textContent
            }" at ${currentLine.style.left}, ${
              currentLine.style.top
            } rotated ${randomRotation}°`
          );

          // Hide after 2 seconds
          setTimeout(() => {
            currentLine.classList.remove("show");
            currentLine.classList.add("hide");

            // Show next line after hide animation
            setTimeout(() => {
              currentPoemLine++;
              showPoemLine(currentPoemLine);
            }, 1000);
          }, 2000);
        }

        function stopPoemAnimation() {
          const poemLines = document.querySelectorAll(".poem-line");
          poemLines.forEach((line) => {
            line.classList.remove("show");
            line.classList.add("hide");
          });
          currentPoemLine = 0;
        }

        // Initialize Web Audio API
        function initAudioContext() {
          if (!audioContext) {
            audioContext = new (window.AudioContext ||
              window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;

            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            console.log("🎵 Audio context initialized");
          }
        }

        // Connect video to audio analysis
        function connectAudioSource() {
          if (!audioContext || !manhkiuc) return;

          // Only connect once
          if (audioSourceConnected) {
            console.log("🎵 Audio source already connected, skipping");
            return;
          }

          try {
            source = audioContext.createMediaElementSource(manhkiuc);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            audioSourceConnected = true;
            console.log("🎵 Audio source connected to analyser");
          } catch (error) {
            console.warn("⚠️ Could not connect audio source:", error);

            // Try to create a simple oscillator as fallback
            try {
              console.log("🔄 Trying oscillator fallback...");
              const oscillator = audioContext.createOscillator();
              const gainNode = audioContext.createGain();

              oscillator.connect(gainNode);
              gainNode.connect(analyser);
              analyser.connect(audioContext.destination);

              gainNode.gain.setValueAtTime(0, audioContext.currentTime);
              oscillator.start();
              oscillator.stop(audioContext.currentTime + 0.1);

              console.log("🎵 Oscillator fallback connected");
            } catch (fallbackError) {
              console.warn("⚠️ Oscillator fallback failed:", fallbackError);
            }
          }
        }

        // Draw wave visualizer
        function drawWave() {
          // Check if audio analysis is available
          if (!analyser || !dataArray) {
            // Use fallback animation
            drawFallbackWave();
            return;
          }

          try {
            analyser.getByteFrequencyData(dataArray);

            const canvasWidth = waveCanvas.getBoundingClientRect().width;
            const canvasHeight = waveCanvas.getBoundingClientRect().height;

            // Clear canvas with fade effect
            waveCtx.fillStyle = "rgba(0, 0, 0, 0.1)";
            waveCtx.fillRect(0, 0, canvasWidth, canvasHeight);

            // Calculate bass, mid, and treble frequencies
            const bassEnd = Math.floor(dataArray.length * 0.1);
            const midEnd = Math.floor(dataArray.length * 0.4);

            let bassSum = 0,
              midSum = 0,
              trebleSum = 0;
            for (let i = 0; i < bassEnd; i++) bassSum += dataArray[i];
            for (let i = bassEnd; i < midEnd; i++) midSum += dataArray[i];
            for (let i = midEnd; i < dataArray.length; i++)
              trebleSum += dataArray[i];

            const bassAvg = bassSum / bassEnd;
            const midAvg = midSum / (midEnd - bassEnd);
            const trebleAvg = trebleSum / (dataArray.length - midEnd);

            const totalEnergy = (bassAvg + midAvg + trebleAvg) / 3;
            const energyMultiplier = Math.min(totalEnergy / 50, 3); // Boost up to 3x

            // Create dynamic gradient based on frequency content
            const gradient = waveCtx.createLinearGradient(0, 0, canvasWidth, 0);
            if (bassAvg > midAvg && bassAvg > trebleAvg) {
              // Bass dominant - red to orange
              gradient.addColorStop(0, "#ff4444");
              gradient.addColorStop(0.5, "#ff8844");
              gradient.addColorStop(1, "#ffaa44");
            } else if (trebleAvg > bassAvg && trebleAvg > midAvg) {
              // Treble dominant - cyan to blue
              gradient.addColorStop(0, "#44ffff");
              gradient.addColorStop(0.5, "#4488ff");
              gradient.addColorStop(1, "#4444ff");
            } else {
              // Balanced - rainbow
              gradient.addColorStop(0, "#ff0000");
              gradient.addColorStop(0.2, "#ff69b4");
              gradient.addColorStop(0.4, "#9932cc");
              gradient.addColorStop(0.6, "#0000ff");
              gradient.addColorStop(0.8, "#00ffff");
              gradient.addColorStop(1, "#32cd32");
            }

            // Draw enhanced wave with rhythm detection
            const barWidth = canvasWidth / dataArray.length;
            const centerY = canvasHeight / 2;

            for (let i = 0; i < dataArray.length; i++) {
              let barHeight = (dataArray[i] / 255) * (canvasHeight * 0.9);

              // Apply energy multiplier for stronger response
              barHeight *= energyMultiplier;

              // Add rhythm enhancement based on frequency range
              if (i < bassEnd) {
                // Bass frequencies - slower, bigger waves
                barHeight *= 1 + bassAvg / 100;
              } else if (i < midEnd) {
                // Mid frequencies - balanced response
                barHeight *= 1 + midAvg / 150;
              } else {
                // Treble frequencies - faster, sharper response
                barHeight *= 1 + trebleAvg / 200;
              }

              // Limit maximum height
              barHeight = Math.min(barHeight, canvasHeight * 0.9);

              const x = i * barWidth;

              // Create multiple layers with enhanced effects
              for (let layer = 0; layer < 4; layer++) {
                const layerOffset = layer * 1.5;
                const layerHeight = barHeight * (1 - layer * 0.15);
                const layerAlpha =
                  (1 - layer * 0.2) * Math.min(energyMultiplier, 1.5);

                waveCtx.fillStyle = gradient;
                waveCtx.globalAlpha = layerAlpha;
                waveCtx.fillRect(
                  x + layerOffset,
                  centerY - layerHeight / 2,
                  Math.max(barWidth - 1, 1),
                  layerHeight
                );
              }
            }

            // Add dynamic glow effect based on energy
            const glowIntensity = Math.min(totalEnergy / 30, 15);
            waveCtx.shadowColor = "#ffffff";
            waveCtx.shadowBlur = glowIntensity;
            waveCtx.globalAlpha = 0.4 * Math.min(energyMultiplier, 2);

            // Redraw with enhanced glow
            for (let i = 0; i < dataArray.length; i++) {
              let barHeight = (dataArray[i] / 255) * (canvasHeight * 0.9);
              barHeight *= energyMultiplier;

              if (i < bassEnd) barHeight *= 1 + bassAvg / 100;
              else if (i < midEnd) barHeight *= 1 + midAvg / 150;
              else barHeight *= 1 + trebleAvg / 200;

              barHeight = Math.min(barHeight, canvasHeight * 0.9);
              const x = i * barWidth;

              waveCtx.fillStyle = gradient;
              waveCtx.fillRect(
                x,
                centerY - barHeight / 2,
                Math.max(barWidth - 1, 1),
                barHeight
              );
            }

            // Add center pulse effect for bass
            if (bassAvg > 30) {
              const pulseRadius = (bassAvg / 255) * 20 * energyMultiplier;
              const pulseAlpha = Math.min(bassAvg / 100, 0.6);

              waveCtx.shadowBlur = 20;
              waveCtx.globalAlpha = pulseAlpha;
              waveCtx.fillStyle = "#ff4444";
              waveCtx.beginPath();
              waveCtx.arc(
                canvasWidth / 2,
                centerY,
                pulseRadius,
                0,
                Math.PI * 2
              );
              waveCtx.fill();
            }

            // Reset shadow and alpha
            waveCtx.shadowBlur = 0;
            waveCtx.globalAlpha = 1;

            animationId = requestAnimationFrame(drawWave);
          } catch (error) {
            console.warn("⚠️ Audio analysis failed, using fallback:", error);
            drawFallbackWave();
          }
        }

        // Fallback wave animation without audio data
        function drawFallbackWave() {
          const canvasWidth = waveCanvas.getBoundingClientRect().width;
          const canvasHeight = waveCanvas.getBoundingClientRect().height;

          // Clear canvas with fade effect
          waveCtx.fillStyle = "rgba(0, 0, 0, 0.1)";
          waveCtx.fillRect(0, 0, canvasWidth, canvasHeight);

          // Create dynamic gradient that changes over time
          const time = Date.now() * 0.002;
          const gradient = waveCtx.createLinearGradient(0, 0, canvasWidth, 0);

          // Animate gradient colors
          const hue1 = (Math.sin(time) * 30 + 330) % 360;
          const hue2 = (Math.sin(time + 2) * 30 + 60) % 360;
          const hue3 = (Math.sin(time + 4) * 30 + 180) % 360;

          gradient.addColorStop(0, `hsl(${hue1}, 100%, 50%)`);
          gradient.addColorStop(0.5, `hsl(${hue2}, 100%, 50%)`);
          gradient.addColorStop(1, `hsl(${hue3}, 100%, 50%)`);

          // Create more complex animated wave pattern
          const numBars = 128;
          const barWidth = canvasWidth / numBars;
          const centerY = canvasHeight / 2;

          for (let i = 0; i < numBars; i++) {
            // Create multiple wave patterns with different frequencies
            const wave1 = Math.sin(time + i * 0.08) * 0.4;
            const wave2 = Math.sin(time * 1.7 + i * 0.15) * 0.3;
            const wave3 = Math.sin(time * 0.6 + i * 0.03) * 0.2;
            const wave4 = Math.sin(time * 2.3 + i * 0.25) * 0.1;

            // Add rhythm simulation
            const beat = Math.sin(time * 2) > 0.8 ? 1.5 : 1;
            const barHeight =
              (wave1 + wave2 + wave3 + wave4 + 1) * canvasHeight * 0.6 * beat;
            const x = i * barWidth;

            // Create enhanced layers for depth effect
            for (let layer = 0; layer < 5; layer++) {
              const layerOffset = layer * 1.2;
              const layerHeight = barHeight * (1 - layer * 0.12);
              const layerAlpha = (1 - layer * 0.15) * 0.8;

              waveCtx.fillStyle = gradient;
              waveCtx.globalAlpha = layerAlpha;
              waveCtx.fillRect(
                x + layerOffset,
                centerY - layerHeight / 2,
                Math.max(barWidth - 1, 1),
                layerHeight
              );
            }
          }

          // Add dynamic glow effect
          const glowIntensity = 8 + Math.sin(time * 3) * 5;
          waveCtx.shadowColor = "#ffffff";
          waveCtx.shadowBlur = glowIntensity;
          waveCtx.globalAlpha = 0.4;

          // Redraw with glow
          for (let i = 0; i < numBars; i++) {
            const wave1 = Math.sin(time + i * 0.08) * 0.4;
            const wave2 = Math.sin(time * 1.7 + i * 0.15) * 0.3;
            const wave3 = Math.sin(time * 0.6 + i * 0.03) * 0.2;
            const wave4 = Math.sin(time * 2.3 + i * 0.25) * 0.1;

            const beat = Math.sin(time * 2) > 0.8 ? 1.5 : 1;
            const barHeight =
              (wave1 + wave2 + wave3 + wave4 + 1) * canvasHeight * 0.6 * beat;
            const x = i * barWidth;

            waveCtx.fillStyle = gradient;
            waveCtx.fillRect(
              x,
              centerY - barHeight / 2,
              Math.max(barWidth - 1, 1),
              barHeight
            );
          }

          // Add center pulse effect
          const pulseRadius = 15 + Math.sin(time * 4) * 10;
          const pulseAlpha = 0.3 + Math.sin(time * 6) * 0.2;

          waveCtx.shadowBlur = 25;
          waveCtx.globalAlpha = pulseAlpha;
          waveCtx.fillStyle = `hsl(${(hue1 + hue2) / 2}, 100%, 70%)`;
          waveCtx.beginPath();
          waveCtx.arc(canvasWidth / 2, centerY, pulseRadius, 0, Math.PI * 2);
          waveCtx.fill();

          // Reset shadow and alpha
          waveCtx.shadowBlur = 0;
          waveCtx.globalAlpha = 1;

          animationId = requestAnimationFrame(drawFallbackWave);
        }

        // Start wave animation
        function startWaveAnimation() {
          if (!isPlaying) return;

          if (animationId) {
            cancelAnimationFrame(animationId);
          }

          initAudioContext();
          connectAudioSource();
          drawWave();
        }

        // Stop wave animation
        function stopWaveAnimation() {
          if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
          }

          // Clear canvas
          const canvasWidth = waveCanvas.getBoundingClientRect().width;
          const canvasHeight = waveCanvas.getBoundingClientRect().height;
          waveCtx.clearRect(0, 0, canvasWidth, canvasHeight);
        }

        // Test audio function
        window.testAudio = function () {

        window.enterSite = function () {

          if (enterOverlay) {

              console.warn(

                err

              // Try to resume WebAudio context (some browsers require it)
              try {
                const AudioCtx =
                  window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {

                    await ctx.resume();
                    console.log(`🎛️ AudioContext resumed for ${idLabel}`);

                }
              } catch (e) {

              await new Promise((r) => setTimeout(r, retryDelays[i]));
